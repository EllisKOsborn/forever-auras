name: Tests

on:
  push:
  pull_request:

# Read-only token: the tests never need to write to the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leafo/gh-actions-lua@35bcb06abec04ec87df82e08caa84d545348536e # v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@e65774a6386cb4f24e293dca7fc4ff89165b64c5 # v4
      - name: Install busted and luacheck
        run: |
          luarocks install busted
          luarocks install luacheck
      - name: Lint
        run: luacheck .
      - name: Pack and README are up to date
        run: lua tools/build.lua --check
      - name: Tests
        run: busted
